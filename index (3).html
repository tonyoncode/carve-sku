const LET={a:'A',ay:'A',b:'B',bee:'B',be:'B',c:'C',see:'C',sea:'C',cee:'C',d:'D',dee:'D',e:'E',f:'F',eff:'F',ef:'F',g:'G',gee:'G',h:'H',aitch:'H',i:'I',eye:'I',j:'J',jay:'J',k:'K',kay:'K',l:'L',el:'L',m:'M',em:'M',n:'N',en:'N',o:'O',oh:'O',p:'P',pee:'P',q:'Q',cue:'Q',queue:'Q',r:'R',are:'R',s:'S',ess:'S',t:'T',tee:'T',tea:'T',u:'U',you:'U',v:'V',vee:'V',w:'W',x:'X',ex:'X',y:'Y',why:'Y',z:'Z',zee:'Z',zed:'Z'};
const DIG={zero:'0',oh:'0',one:'1',won:'1',two:'2',to:'2',too:'2',three:'3',tree:'3',four:'4',for:'4',fore:'4',five:'5',six:'6',seven:'7',eight:'8',ate:'8',nine:'9'};
const TEEN={ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19};
const TENS={twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
function atomOf(t,ri){
  const o=[];
  if(/^\d+$/.test(t))o.push(t);
  else{
    if(LET[t])o.push(LET[t]);
    if(DIG[t])o.push(DIG[t]);
    if(TEEN[t])o.push(String(TEEN[t]));
    if(TENS[t])o.push(String(TENS[t]));
    if(/^[a-z0-9]{2,6}$/.test(t))o.push(t.toUpperCase());
  }
  return{opts:[...new Set(o)],ri};
}
function buildAtoms(items){ // items: [{t,ri}]
  const out=[];
  for(let i=0;i<items.length;i++){
    const {t,ri}=items[i],nx=items[i+1]&&items[i+1].t;
    if((t==='double'||t==='triple'||t==='dubble')&&nx){
      if(nx==='u'||nx==='you'){out.push({opts:['W'],ri});i++;continue}
      const a=atomOf(nx,ri),n=t==='triple'?3:2;
      out.push({opts:a.opts.map(x=>x.length===1?x.repeat(n):x),ri});i++;continue;
    }
    if(TENS[t]&&nx&&/^(one|two|three|four|five|six|seven|eight|nine)$/.test(nx)){
      out.push({opts:[String(TENS[t]+ +DIG[nx])],ri});i++;continue;
    }
    out.push(atomOf(t,ri));
  }
  return out;
}
function extend(atoms,i,cand){
  let best={s:cand,used:0};
  if(cand.length>=6||i>=atoms.length)return best;
  for(const o of atoms[i].opts){
    const n=cand+o;
    if(PS.has(n)){const r=extend(atoms,i+1,n);if(r.s.length>best.s.length)best={s:r.s,used:r.used+1}}
  }
  return best;
}
// find the most recently spoken SKU (or prefix) in the atom list
function findSku(atoms){
  const hits=[];
  for(let s=0;s<atoms.length;s++){
    const r=extend(atoms,s,'');
    if(r.s.length>=3&&PFX.has(r.s.slice(0,3)))hits.push({s,used:r.used,c:r.s});
  }
  if(!hits.length)return null;
  let pick=hits[hits.length-1];
  for(const h of hits){if(h!==pick&&h.s<pick.s&&h.s+h.used>pick.s){pick=h;break}}
  return{cand:pick.c,ri:atoms[pick.s].ri};
}

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){lst.textContent='This browser has no speech recognition. Use Chrome.';return false}
  rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';rec.maxAlternatives=1;
  sess++;lastKey='';
  rec.onresult=onSpeech;
  rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){lst.textContent='Speech recognition blocked: '+ev.error;stopListen()}};
  rec.onend=()=>{if(listening)setTimeout(()=>{if(listening){try{startRec()}catch(x){}}},250)};
  try{rec.start(track)}catch(err){
    lst.textContent='Your Chrome is too old to read tab audio directly (needs Chrome 139+). Update Chrome.';
    stopListen();return false;
  }
  return true;
}
async function startListen(){
  try{
    const st=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
    track=st.getAudioTracks()[0];
    st.getVideoTracks().forEach(t=>t.stop());
    if(!track){lst.textContent='No audio shared. Pick the Whatnot TAB and tick "Also share tab audio".';return}
    track.onended=()=>stopListen();
    listening=true;lbtn.textContent='Stop listening';lbtn.classList.add('on');
    lst.textContent='Listening for '+PFX.size+' SKU prefixes...';
    startRec();
  }catch(err){lst.textContent='Cancelled or blocked: '+err.name}
}
function stopListen(){
  listening=false;lbtn.textContent='Listen to tab audio';lbtn.classList.remove('on');
  try{rec&&rec.abort()}catch(e){}
  try{track&&track.stop()}catch(e){}
  rec=null;track=null;
}
lbtn.onclick=()=>listening?(stopListen(),lst.textContent='Stopped'):startListen();
/* ===== Sizes tab ===== */
const SIZES=['XXS','XS','S','M','L','XL','2X','3X','4X'];
const szSel=new Set(),szGrid=document.getElementById('szgrid'),szPrev=document.getElementById('sizeprev'),sstat=document.getElementById('sstat');
function szText(){return SIZES.filter(x=>szSel.has(x)).join(', ')}
function szRefresh(){szPrev.textContent=szText()||'No sizes selected'}
SIZES.forEach(l=>{
  const c=document.createElement('span');c.className='chip';c.textContent=l;
  c.onclick=()=>{if(szSel.has(l)){szSel.delete(l);c.classList.remove('on')}else{szSel.add(l);c.classList.add('on')}szRefresh()};
  szGrid.appendChild(c);
});
function szSetAll(on){szSel.clear();[...szGrid.children].forEach((c,i)=>{c.classList.toggle('on',on);if(on)szSel.add(SIZES[i])});szRefresh()}
document.getElementById('szall').onclick=()=>szSetAll(true);
document.getElementById('szclear').onclick=()=>szSetAll(false);
document.getElementById('szsend').onclick=()=>{
  const t=szText();if(!t){sstat.textContent='Pick at least one size first';return}
  copyText(t);window.postMessage({type:'skubundl-type',text:(ann.checked?'/announce ':'')+t},'*');
  lastSku=sstat;sstat.textContent='Sizes - copied: '+t;
};
szRefresh();
/* ===== Sizes panel on/off ===== */
const side=document.getElementById('side'),tog=document.getElementById('sizetog');
function showSizes(on){
  side.hidden=!on;document.body.classList.toggle('wide',on);
  tog.classList.toggle('on',on);tog.textContent='Sizes: '+(on?'ON':'OFF');
  try{localStorage.setItem('sizes',on?'1':'0')}catch(e){}
}
tog.onclick=()=>showSizes(side.hidden);
let szOn=true;try{if(localStorage.getItem('sizes')==='0')szOn=false}catch(e){}
showSizes(szOn);
window.__skuParse=txt=>findSku(buildAtoms(txt.toLowerCase().replace(/[-']/g,' ').split(/\s+/).filter(Boolean).map(t=>({t,ri:0}))));
</script>

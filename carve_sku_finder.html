function copyText(t){
  const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).catch(fb)}else{fb()}
}
let lastSku=null;
window.addEventListener('message',e=>{
  if(e.source!==window||!e.data||e.data.type!=='skubundl-typed'||!lastSku)return;
  lastSku.textContent=lastSku.textContent.replace(/ - (copied|typed).*$/,'')+(e.data.ok?' - typed in Whatnot chat: ':' - copied (Whatnot chat not found): ')+e.data.text;
});
const q=document.getElementById('q'),out=document.getElementById('out');
q.addEventListener('input',()=>{
  const v=q.value.trim().toUpperCase();out.innerHTML='';
  if(!v)return;
  Object.keys(D).filter(k=>k.includes(v)).slice(0,10).forEach(k=>{
    const [n,p]=D[k],txt=p+' '+n;
    const d=document.createElement('div');d.className='row';
    d.innerHTML='<div><b>'+n+'</b><div class="sku">'+k+'</div></div><div class="price">'+p+'</div>';
    d.onclick=()=>{copyText(txt);window.postMessage({type:'skubundl-type',text:txt},'*');document.querySelectorAll('.row').forEach(r=>r.classList.remove('copied'));d.classList.add('copied');lastSku=d.querySelector('.sku');lastSku.textContent=k+' - copied: '+txt};
    out.appendChild(d);
  });
  if(!out.children.length)out.innerHTML='<div class="hint">No match</div>';
});
